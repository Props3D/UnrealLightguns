; Blamcon Lightguns for Unreal — plugin config.
;
; A plugin may only use its own name for an ini file, so this is the one file in the
; plugin that the engine reads (Engine/Config/PluginBase.ini is its first layer).
; A Config/DefaultEngine.ini placed inside a plugin is NOT read by the engine.

[CoreRedirects]
; ULightgunSubsystem -> UBlamconLightgunSubsystem. The old name collided with the
; ULightgunSubsystem in the unrelated LightgunLab plugin; UHT requires reflected type
; names to be unique across a project, so both could not be installed at once.
; Keeps Blueprints saved against the old class resolving. See README, "Upgrading".
+ClassRedirects=(OldName="/Script/Lightguns.LightgunSubsystem",NewName="/Script/Lightguns.BlamconLightgunSubsystem")
